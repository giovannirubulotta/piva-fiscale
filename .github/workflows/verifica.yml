# Pipeline di verifica: gira su ogni push e su ogni pull request.
#
# Il punto non è avere una spunta verde, è che una regressione non arrivi in
# produzione senza che nessuno se ne accorga. Per questo i controlli falliscono
# la build invece di limitarsi a segnalare: typecheck, lint, test del dominio
# fiscale, contrasto WCAG e performance budget sono tutti bloccanti.
name: Verifica

on:
  push:
    branches: [main]
  pull_request:

# Un push che arriva mentre gira la verifica precedente la annulla: si verifica
# l'ultimo stato del codice, non una coda di stati intermedi.
concurrency:
  group: verifica-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` e non `npm install`: installa esattamente ciò che è nel
      # lockfile e fallisce se il lockfile è disallineato dal package.json.
      - name: Installa le dipendenze
        run: npm ci

      - name: Controllo dei tipi
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Contrasto WCAG 2.1 AA
        run: npm run contrasto

      # Le variabili sono finte: la build deve compilare senza toccare il
      # database reale. I segreti veri stanno solo su Vercel.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://esempio.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chiave-finta-per-la-build

      - name: Performance budget
        run: npm run budget

      # I browser di Playwright pesano centinaia di MB: si scaricano solo qui,
      # dopo che tutto il resto è passato, e solo Chromium con le sue dipendenze
      # di sistema. Un E2E rosso a valle di un typecheck rosso non aggiunge
      # informazione, ma costa minuti di pipeline.
      - name: Installa Chromium per i test end-to-end
        run: npx playwright install --with-deps chromium

      - name: Test end-to-end (percorsi critici)
        run: npm run e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://esempio.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chiave-finta-per-la-build

      # Trace e screenshot dei fallimenti: senza, un test rosso in CI e verde in
      # locale è una caccia al fantasma.
      - name: Conserva il referto dei test falliti
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
